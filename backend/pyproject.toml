[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-research-hub"
version = "1.2.0"
description = "Local internal-document retrieval and MCP service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "pypdf>=6.19,<7", "beautifulsoup4>=4.13,<5", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
cloud = ["cryptography>=46,<51"]
mcp = ["mcp>=1.30,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "fonttools>=4,<5"]
semantic = ["onnxruntime>=1.24.2,<2", "tokenizers>=0.23,<1", "numpy>=2.1,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "build>=1,<2", "setuptools>=75"]

[project.scripts]
research-hub = "research_agent.hub_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["research_agent"]
branch = true

[tool.coverage.report]
show_missing = true
